
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: voxai
      POSTGRES_PASSWORD: voxai_password
      POSTGRES_DB: voxai_db
    # The internal PostgreSQL port is 5432 inside the container.
    # We map it to a dedicated host port (default 5434) to avoid conflicts
    # with other projects like quickvoice-dev-postgres (5432) or education_llm_db (5433).
    # You can override this using the POSTGRES_HOST_PORT environment variable.
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://voxai:voxai_password@db:5432/voxai_db
    volumes:
      - ./backend:/app
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
